<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your basket - Scroll Spree</title>

    <th:block th:replace="~{fragments/layout :: head-assets}"></th:block>
    <link rel="stylesheet" th:href="@{/css/cart.css}">
</head>
<body>

<header th:replace="~{fragments/layout :: header('')}"></header>

<main class="container cart-page">

    <h1 class="cart-heading">Your basket</h1>

    <!-- Empty Basket State -->
    <div id="cart-empty" class="cart-status" th:if="${cart == null or #lists.isEmpty(cart.items)}">
        <i class="fa-solid fa-basket-shopping"></i>
        <p>Your basket is empty.</p>
        <a href="/#collection" class="btn btn-primary">Browse the collection</a>
    </div>

    <!-- Active Basket State -->
    <div id="cart-content" th:if="${cart != null and not #lists.isEmpty(cart.items)}">
        <ul class="cart-list">
            <li class="cart-item" th:each="item : ${cart.items}">

                <!-- Product Media -->
                <div class="cart-item-media">
                    <img th:if="${item.product.imageIds != null and not #lists.isEmpty(item.product.imageIds)}"
                         th:src="@{/api/productimages/{imageId}(imageId=${item.product.imageIds[0]})}"
                         th:alt="${item.product.name}">
                    <div class="product-media-empty" th:if="${item.product.imageIds == null or #lists.isEmpty(item.product.imageIds)}">
                        <i class="fa-regular fa-image"></i>
                    </div>
                </div>

                <!-- Product Body -->
                <div class="cart-item-body">
                    <a class="cart-item-name" th:href="@{/products/{id}(id=${item.product.id})}" th:text="${item.product.name}">Product name</a>
                    <span class="cart-item-unit" th:text="'$' + ${#numbers.formatDecimal(item.product.price, 1, 2)} + ' each'">$0.00 each</span>
                </div>

                <!-- Quantity Stepper Form -->
                <form th:action="@{/cart/update}" method="post" class="stepper-form">
                    <input type="hidden" name="productId" th:value="${item.product.id}"/>
                    <div class="stepper">
                        <button type="submit" name="quantity" th:value="${item.quantity - 1}" class="stepper-btn" aria-label="Decrease quantity">−</button>
                        <span class="stepper-value" th:text="${item.quantity}">1</span>
                        <button type="submit" name="quantity" th:value="${item.quantity + 1}" class="stepper-btn" aria-label="Increase quantity">+</button>
                    </div>
                </form>

                <!-- Line Total -->
                <strong class="cart-item-total" th:text="'$' + ${#numbers.formatDecimal(item.product.price * item.quantity, 1, 2)}">$0.00</strong>

                <!-- Remove Item Form -->
                <form th:action="@{/cart/remove}" method="post">
                    <input type="hidden" name="productId" th:value="${item.product.id}"/>
                    <button type="submit" class="cart-item-remove" th:attr="aria-label='Remove ' + ${item.product.name}">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </form>
            </li>
        </ul>

        <!-- Summary Sidebar -->
        <aside class="cart-summary">
            <div class="summary-row">
                <span>Subtotal</span>
                <strong th:text="'$' + ${#numbers.formatDecimal(cart.totalPrice, 1, 2)}">$0.00</strong>
            </div>
            <p class="summary-note">Shipping and taxes are calculated at checkout.</p>

            <a href="/checkout" class="btn btn-primary btn-block btn-lg">
                Proceed to checkout
            </a>

            <form th:action="@{/cart/clear}" method="post" style="margin-top: 12px;">
                <button type="submit" class="btn btn-danger-outline btn-block">
                    Clear basket
                </button>
            </form>
        </aside>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
