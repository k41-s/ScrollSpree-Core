<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Scroll Spree</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/login.css">
</head>
<body class="login-page">

<div class="login-card">
    <h2 class="login-title">Login</h2>

    <!-- Error message display -->
    <div th:if="${error}" class="alert alert-danger" style="color: red; margin-bottom: 1rem;" th:text="${error}"></div>

    <form th:action="@{/auth/login}" th:object="${loginDto}" method="POST">
        <div class="form-group">
            <label for="username" class="form-label">Username</label>
            <input type="text" id="username" th:field="*{username}" class="form-control" placeholder="Enter username" required>
        </div>

        <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" th:field="*{password}" class="form-control" placeholder="Enter password" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Login</button>
    </form>

    <div class="go-to-reg-container">
        <a th:href="@{/auth/register}" class="go-to-register">Don't have an account? Register here.</a>
    </div>
</div>

</body>
</html>
