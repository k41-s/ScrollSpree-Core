<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Scroll Spree</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/login.css">
    <script src="/js/auth.js"></script>
    <script src="/js/cart.js"></script>
</head>
<body class="login-page">

<div class="login-card">
    <h2 class="login-title">Login</h2>

    <form id="loginForm">
        <div class="form-group">
            <label for="username" class="form-label">Username</label>
            <input type="text" id="username" class="form-control" placeholder="Enter username" required>
        </div>

        <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" class="form-control" placeholder="Enter password" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Login</button>
    </form>

    <div class="go-to-reg-container">
        <a th:href="@{/auth/register}" class="go-to-register">Don't have an account? Register here.</a>
    </div>
</div>

<div class="toast" data-toast role="status" aria-live="polite" hidden></div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            if (response.ok) {
                const data = await response.json();

                localStorage.setItem('token', data.token);
                localStorage.setItem('refreshToken', data.refreshToken);

                await ScrollSpreeCart.syncGuestCartToApi();

                redirectBasedOnRole(data.token);
            } else {
                alert("Login Failed: Invalid credentials");
            }
        } catch (error) {
            console.error("Error:", error);
            alert("An error occurred during login.");
        }
    });
</script>
</body>
</html>
