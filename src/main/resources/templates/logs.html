<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Logs - Scroll Spree</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/logs.css">
    <script src="/js/auth.js"></script>
</head>
<body class="logs-page">

<div class="container">
    <div class="logs-header">
        <h2>System Logs</h2>
        <div class="logs-actions">
            <button id="refreshBtn" class="btn btn-outline">Refresh Logs</button>
            <button onclick="logout()" class="btn btn-danger-outline">Logout</button>
        </div>
    </div>

    <div class="table-container">
        <table class="admin-table">
            <thead>
            <tr>
                <th>ID</th>
                <th>Timestamp</th>
                <th>Level</th>
                <th>Message</th>
            </tr>
            </thead>
            <tbody id="logTableBody">
            </tbody>
        </table>
    </div>
</div>

<script>
    async function fetchLogs() {
        const token = localStorage.getItem('token');

        if (!token) {
            window.location.href = '/auth/login';
            return;
        }

        try {
            const response = await fetchWithAuth('/api/logs', {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json'
                }
            });

            if (response.ok) {
                const logs = await response.json();
                const tbody = document.getElementById('logTableBody');
                tbody.innerHTML = '';

                logs.forEach(log => {
                    const row = `<tr>
                                <td>${log.id}</td>
                                <td>${new Date(log.timestamp).toLocaleString()}</td>
                                <td>${log.level}</td>
                                <td>${log.message}</td>
                            </tr>`;
                    tbody.innerHTML += row;
                });
            } else if (response.status === 403) {
                alert("Access Denied: Only Admins can view logs.");
                window.location.href = '/auth/login';
            }

        } catch (error) {
            console.error("Error fetching logs:", error);
        }
    }

    document.getElementById('refreshBtn').addEventListener('click', fetchLogs);

    fetchLogs();
</script>
</body>
</html>
