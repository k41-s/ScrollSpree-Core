<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Scroll Spree</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/login.css">
</head>
<body class="login-page">

<div class="login-card">
    <h2 class="login-title">Register</h2>

    <div th:if="${error}" class="alert alert-danger" style="color: red; margin-bottom: 1rem;" th:text="${error}"></div>

    <form th:action="@{/auth/register}" th:object="${registerDto}" method="POST">
        <div class="form-group">
            <label for="username" class="form-label">Username</label>
            <input type="text" id="username" th:field="*{username}" class="form-control" placeholder="Username" required>
        </div>

        <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" th:field="*{password}" class="form-control" placeholder="Password" required>
        </div>

        <div class="form-group">
            <label for="name" class="form-label">Name</label>
            <input type="text" id="name" th:field="*{name}" class="form-control" placeholder="Name" required>
        </div>

        <div class="form-group">
            <label for="surname" class="form-label">Surname</label>
            <input type="text" id="surname" th:field="*{surname}" class="form-control" placeholder="Surname" required>
        </div>

        <div class="form-group">
            <label for="email" class="form-label">Email</label>
            <input type="email" id="email" th:field="*{email}" class="form-control" placeholder="Email" required>
        </div>

        <div class="form-group">
            <label for="phone" class="form-label">Phone</label>
            <input type="text" id="phone" th:field="*{phone}" class="form-control" placeholder="Phone" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Register</button>
    </form>

    <div class="go-to-reg-container">
        <a th:href="@{/auth/login}" class="go-to-register">Already have an account? Login here.</a>
    </div>
</div>

</body>
</html>
